name: server
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.21'}
      - name: 单元测试
        working-directory: server
        run: go test ./... -v -count=1
      - name: 构建服务端
        working-directory: server
        run: CGO_ENABLED=1 go build -ldflags="-s -w" -o ../dist/jdyc-hub-server-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with: {name: jdyc-server-bin, path: dist/jdyc-hub-server-linux-amd64}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pillow && python assets-src/gen_icons.py
      - uses: actions/upload-artifact@v4
        with: {name: jdyc-assets, path: assets/}
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.21'}
      - name: 集成测试（起frps+server，全链路API/WS断言）
        working-directory: server
        env:
          JDYC_LISTEN: ":7100"
          JDYC_DB: "/tmp/jdyc.db"
          JDYC_JWT_SECRET: "test-secret"
          JDYC_FRPS_HOST: "127.0.0.1"
          JDYC_FRPS_PORT: "7000"
          JDYC_FRPS_TOKEN: "test-token"
          JDYC_SUPERNODE: "127.0.0.1:7777"
          JDYC_ADMIN_PASS_PEPPER: "test-pepper"
        run: |
          docker run -d --name frps --network host \
            snowdreamtech/frps -t test-token -p 7000 \
            --bind_port 7000 --allow_ports 20000-29999
          go test -tags=integration -run TestIntegration -v -count=1 .
